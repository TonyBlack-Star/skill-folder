<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流量与销售分析</title>
<style>
:root{
  --paper:#FBFAF7;
  --ink:#1A1A1A;
  --ink-soft:#5F5B54;
  --ink-faint:#8A857C;
  --rule:#DDD8CF;
  --rule-strong:#1A1A1A;
  --accent:#B03A2E;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC",serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px 72px;}

.masthead{padding-top:36px;}
.rule-thick{height:3px;background:var(--rule-strong);}
.rule-thin{height:1px;background:var(--rule);}
.masthead-top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 0;}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500;}
.masthead-meta{font-size:12px;color:var(--ink-faint);letter-spacing:.02em;}
h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.12;letter-spacing:-.012em;margin:18px 0 0;}
.standfirst{font-family:var(--serif);font-size:17px;line-height:1.62;color:var(--ink-soft);max-width:760px;margin:14px 0 0;}

.controls{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;padding:22px 0 26px;border-bottom:1px solid var(--rule);margin-top:28px;}
.ctl{display:flex;flex-direction:column;gap:6px;}
.ctl-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
select,input[type=date]{font-family:var(--sans);font-size:13px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:4px 2px;min-width:150px;outline:none;}
select:focus,input[type=date]:focus{border-bottom-color:var(--accent);}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:620px;}
.chip{font-size:12px;color:var(--ink-soft);border:1px solid var(--rule);padding:5px 11px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;background:transparent;}
.chip:hover{border-color:var(--ink-faint);}
.chip.on{background:var(--ink);color:#FBFAF7;border-color:var(--ink);}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.range{display:flex;align-items:flex-end;gap:8px;}
.range span{font-size:12px;color:var(--ink-faint);padding-bottom:5px;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin:34px 0 0;}
.kpi{border-top:1px solid var(--rule);padding-top:13px;}
.kpi-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.kpi-value{font-family:var(--serif);font-size:40px;line-height:1.06;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;}
.kpi-note{font-size:12px;color:var(--ink-faint);margin-top:5px;}

.block{margin-top:52px;}
.block-title{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 4px;letter-spacing:-.01em;}
.block-sub{font-size:12px;color:var(--ink-faint);margin:0 0 18px;}
.legend{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:12px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);}
.chart-wrap{position:relative;height:410px;}
.chart-wrap.short{height:260px;}
canvas{display:block;}

.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;text-align:right;padding:0 0 9px 16px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;}
thead th:first-child,tbody td:first-child{text-align:left;padding-left:0;}
tbody td{text-align:right;padding:9px 0 9px 16px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;white-space:nowrap;}
tbody tr:hover td{background:#F4F1EA;}
td.dim{color:var(--ink-faint);}
tfoot td{text-align:right;padding:11px 0 0 16px;border-top:1px solid var(--rule-strong);font-weight:500;font-variant-numeric:tabular-nums;}
tfoot td:first-child{text-align:left;padding-left:0;}

footer{margin-top:56px;padding-top:16px;border-top:3px solid var(--rule-strong);font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.fallback-note{display:none;margin-top:10px;font-size:12px;color:var(--accent);}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}h1{font-size:34px;}.wrap{padding:0 20px 56px;}}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="rule-thick"></div>
  <div class="masthead-top">
    <span class="kicker">Shopify 数据分析</span>
    <span class="masthead-meta" id="metaRange"></span>
  </div>
  <h1>流量与销售表现</h1>
  <p class="standfirst">按产品与日期对齐的流量、加购、结账与销售数据。切换周期时，计数类指标按区间求和，比率类指标由合计后的分子与分母重新计算，不做简单平均。</p>
</header>

<section class="controls">
  <div class="ctl">
    <label class="ctl-label" for="productSel">产品</label>
    <select id="productSel"></select>
  </div>
  <div class="ctl">
    <label class="ctl-label" for="periodSel">时间维度</label>
    <select id="periodSel">
      <option value="daily">日</option>
      <option value="weekly">周</option>
      <option value="monthly">月</option>
    </select>
  </div>
  <div class="ctl">
    <label class="ctl-label">日期区间</label>
    <div class="range">
      <input type="date" id="startDate"><span>至</span><input type="date" id="endDate">
    </div>
  </div>
  <div class="ctl">
    <label class="ctl-label">指标（可多选）</label>
    <div class="chips" id="chips"></div>
  </div>
</section>

<section class="kpis" id="kpis"></section>

<section class="block">
  <h2 class="block-title">趋势</h2>
  <p class="block-sub" id="chartSub"></p>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  <p class="fallback-note" id="fbNote"></p>
</section>

<section class="block">
  <h2 class="block-title">销售额分布</h2>
  <p class="block-sub">按所选周期的销售额合计（欧元 EUR）。</p>
  <div class="chart-wrap short"><canvas id="barChart"></canvas></div>
</section>

<section class="block">
  <h2 class="block-title">明细</h2>
  <p class="block-sub" id="tableSub"></p>
  <div class="table-scroll">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot><tr id="tfoot"></tr></tfoot>
    </table>
  </div>
</section>

<footer>
  <span>数据来源：Shopify 流量报表与销售报表，经产品路径与 Product ID 桥接整合。</span>
  <span id="footMeta"></span>
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>/*__CHARTJS__*/</script>
<script>
const DATA = /*__DATA__*/;

const SERIF = "Georgia,'Times New Roman','Songti SC',serif";
const SANS = "-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif";

const PALETTE = ["#1F3A5F","#B03A2E","#2F6F62","#C89B3C","#6E5A7E","#4A4A4A","#8C6D47","#3E6B8F"];
const METRICS = {
  "Online store visitors":{kind:"count"},
  "Sessions":{kind:"count"},
  "Sessions with cart additions":{kind:"count"},
  "Sessions that reached checkout":{kind:"count"},
  "Sessions that completed checkout":{kind:"count"},
  "Bounce rate":{kind:"percent"},
  "Added to cart rate":{kind:"percent"},
  "Reached checkout rate":{kind:"percent"},
  "Checkout conversion rate":{kind:"percent"},
  "Conversion rate":{kind:"percent"},
  "Average session duration":{kind:"duration"},
  "Net items sold":{kind:"count"},
  "Total sales":{kind:"currency"},
  "自定义转化率":{kind:"percent"}
};
const METRIC_KEYS = Object.keys(METRICS);
const COUNTS = ["Online store visitors","Sessions","Sessions with cart additions","Sessions that reached checkout","Sessions that completed checkout","Net items sold","Total sales"];
const RATIO_PARTS = {
  "Added to cart rate":["Sessions with cart additions","Sessions"],
  "Reached checkout rate":["Sessions that reached checkout","Sessions"],
  "Checkout conversion rate":["Sessions that completed checkout","Sessions that reached checkout"],
  "Conversion rate":["Sessions that completed checkout","Sessions"],
  "自定义转化率":["Net items sold","Sessions"]
};
const TABLE_COLS = ["Online store visitors","Sessions","Sessions with cart additions","Sessions that reached checkout","Net items sold","Total sales","Added to cart rate","Conversion rate"];
const DEFAULT_METRICS = ["Sessions","Total sales"];

const METRIC_COLOR = {};
METRIC_KEYS.forEach((k,i)=>{METRIC_COLOR[k]=PALETTE[i%PALETTE.length];});

const CURRENCY_SYMBOL="€", CURRENCY_CODE="EUR";
function num(v){return (v===null||v===undefined||v==="")?null:Number(v);}
function fmtCur(v){
  const s=v<0?"-":"";
  return s+CURRENCY_SYMBOL+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtCurShort(v){
  const a=Math.abs(v), s=v<0?"-":"";
  if(a>=1e6) return s+CURRENCY_SYMBOL+(a/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(a>=1e3) return s+CURRENCY_SYMBOL+(a/1e3).toFixed(1).replace(/\.0$/,"")+"k";
  return s+CURRENCY_SYMBOL+Math.round(a);
}
function fmt(v,kind){
  if(v===null||v===undefined||isNaN(v)) return "—";
  if(kind==="percent") return (v*100).toFixed(2)+"%";
  if(kind==="duration"){
    const m=Math.floor(v/60),s=Math.round(v%60);
    return m>0?m+"m"+String(s).padStart(2,"0")+"s":s+"s";
  }
  if(kind==="currency") return fmtCur(v);
  return Math.round(v).toLocaleString("en-US");
}
function periodKey(day,period){
  if(period==="monthly") return day.slice(0,7);
  if(period==="weekly"){
    const d=new Date(day+"T00:00:00");
    const dow=(d.getDay()+6)%7;
    d.setDate(d.getDate()-dow);
    return d.toISOString().slice(0,10);
  }
  return day;
}
function periodLabel(k,period){
  if(period==="monthly") return k.slice(0,7);
  return k;
}

function aggregate(rows,period){
  const g={};
  rows.forEach(function(r){
    const k=periodKey(r.Day,period);
    if(!g[k]) g[k]={_durW:0,_durS:0,_bW:0,_bS:0,_days:{}};
    const o=g[k];
    o._days[r.Day]=1;
    COUNTS.forEach(function(c){o[c]=(o[c]||0)+(num(r[c])||0);});
    const s=num(r["Sessions"])||0;
    if(s>0){
      const dur=num(r["Average session duration"]);
      if(dur!==null){o._durW+=dur*s;o._durS+=s;}
      const br=num(r["Bounce rate"]);
      if(br!==null){o._bW+=br*s;o._bS+=s;}
    }
  });
  Object.keys(g).forEach(function(k){
    const o=g[k];
    Object.keys(RATIO_PARTS).forEach(function(rate){
      const p=RATIO_PARTS[rate];
      o[rate]=(o[p[1]]>0)?o[p[0]]/o[p[1]]:null;
    });
    o["Bounce rate"]=o._bS>0?o._bW/o._bS:null;
    o["Average session duration"]=o._durS>0?o._durW/o._durS:null;
    o._n=Object.keys(o._days).length;
  });
  return g;
}

const productSel=document.getElementById("productSel");
const periodSel=document.getElementById("periodSel");
const startDate=document.getElementById("startDate");
const endDate=document.getElementById("endDate");
const chipsEl=document.getElementById("chips");

let selected=DEFAULT_METRICS.slice();
let mainChart=null,barChart=null;

Object.keys(DATA.products).forEach(function(p){
  productSel.add(new Option(p,p));
});
startDate.value=DATA.date_min;
endDate.value=DATA.date_max;
document.getElementById("metaRange").textContent="数据区间 "+DATA.date_min+" – "+DATA.date_max;

METRIC_KEYS.forEach(function(m){
  const el=document.createElement("div");
  el.className="chip"+(selected.indexOf(m)>=0?" on":"");
  el.innerHTML='<span class="dot" style="background:'+METRIC_COLOR[m]+'"></span>'+m;
  el.onclick=function(){
    const i=selected.indexOf(m);
    if(i>=0){ if(selected.length>1) selected.splice(i,1); }
    else selected.push(m);
    syncChips();render();
  };
  chipsEl.appendChild(el);
});
function syncChips(){
  Array.prototype.forEach.call(chipsEl.children,function(el,i){
    el.className="chip"+(selected.indexOf(METRIC_KEYS[i])>=0?" on":"");
  });
}

productSel.onchange=render;
periodSel.onchange=render;
startDate.onchange=render;
endDate.onchange=render;

function currentRows(){
  const p=productSel.value;
  return DATA.daily.filter(function(r){
    return r.Product===p && r.Day>=startDate.value && r.Day<=endDate.value;
  });
}

function render(){
  const period=periodSel.value;
  const rows=currentRows();
  const agg=aggregate(rows,period);
  const keys=Object.keys(agg).sort();

  document.getElementById("chartSub").textContent=
    productSel.value+" · "+keys.length+" 个"+({daily:"日",weekly:"周",monthly:"月"}[period])+" · "+startDate.value+" 至 "+endDate.value;

  const total={};
  COUNTS.forEach(function(c){total[c]=keys.reduce(function(a,k){return a+(agg[k][c]||0);},0);});
  Object.keys(RATIO_PARTS).forEach(function(rate){
    const p=RATIO_PARTS[rate];
    total[rate]=total[p[1]]>0?total[p[0]]/total[p[1]]:null;
  });
  let bW=0,bS=0;
  keys.forEach(function(k){bW+=(agg[k]._bW||0);bS+=(agg[k]._bS||0);});
  total["Bounce rate"]=bS>0?bW/bS:null;

  const kpis=[
    {label:"Sessions",value:fmt(total["Sessions"],"count"),note:"会话总数"},
    {label:"Net items sold",value:fmt(total["Net items sold"],"count"),note:"成交件数"},
    {label:"Total sales",value:fmt(total["Total sales"],"currency"),note:"销售额（"+CURRENCY_CODE+"）"},
    {label:"Conversion rate",value:fmt(total["Conversion rate"],"percent"),note:"完成结账 / 会话"}
  ];
  document.getElementById("kpis").innerHTML=kpis.map(function(k){
    return '<div class="kpi"><div class="kpi-label">'+k.label+'</div><div class="kpi-value">'+k.value+'</div><div class="kpi-note">'+k.note+'</div></div>';
  }).join("");

  document.getElementById("legend").innerHTML=selected.map(function(m){
    return '<div class="legend-item"><span class="dot" style="background:'+METRIC_COLOR[m]+'"></span>'+m+'</div>';
  }).join("");

  drawMain(keys,agg,period);
  drawBar(keys,agg,period);
  drawTable(keys,agg,period,total);
}

function drawMain(keys,agg,period){
  const labels=keys.map(function(k){return periodLabel(k,period);});
  const datasets=selected.map(function(m,i){
    return {
      label:m,
      data:keys.map(function(k){return agg[k][m]===undefined?null:agg[k][m];}),
      borderColor:METRIC_COLOR[m],
      backgroundColor:METRIC_COLOR[m],
      borderWidth:1.7,
      pointRadius:0,
      pointHoverRadius:4,
      pointHoverBorderWidth:0,
      tension:0.22,
      spanGaps:true,
      yAxisID:i===0?"y":"y"+i
    };
  });
  const scales={
    x:{grid:{display:false},border:{color:"#DDD8CF"},ticks:{font:{family:SANS,size:11},color:"#8A857C",maxTicksLimit:12,maxRotation:0,autoSkip:true}}
  };
  selected.forEach(function(m,i){
    const id=i===0?"y":"y"+i;
    scales[id]={
      position:i===0?"left":"right",
      display:i===0,
      beginAtZero:true,
      grid:i===0?{color:"#EAE5DB",drawTicks:false}:{display:false},
      border:{display:false},
      ticks:i===0?{font:{family:SANS,size:11},color:"#8A857C",padding:8,callback:function(v){return METRICS[m].kind==="currency"?fmtCurShort(v):fmt(v,METRICS[m].kind);}}:{}
    };
  });

  if(mainChart) mainChart.destroy();
  mainChart=new Chart(document.getElementById("mainChart"),{
    type:"line",
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#1A1A1A",
          titleFont:{family:SERIF,size:13,weight:"400"},
          bodyFont:{family:SANS,size:12},
          padding:12,cornerRadius:2,boxWidth:8,boxHeight:8,usePointStyle:true,
          callbacks:{label:function(c){
            const m=c.dataset.label||"";
            return " "+m+": "+fmt(c.parsed.y,METRICS[m]?METRICS[m].kind:"count");
          }}
        }
      },
      scales:scales
    }
  });
}

function drawBar(keys,agg,period){
  const labels=keys.map(function(k){return periodLabel(k,period);});
  const data=keys.map(function(k){return agg[k]["Total sales"]||0;});
  if(barChart) barChart.destroy();
  barChart=new Chart(document.getElementById("barChart"),{
    type:"bar",
    data:{labels:labels,datasets:[{data:data,backgroundColor:"#1F3A5F",borderWidth:0,barPercentage:0.82,categoryPercentage:0.88}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#1A1A1A",
          titleFont:{family:SERIF,size:13,weight:"400"},
          bodyFont:{family:SANS,size:12},
          padding:12,cornerRadius:2,
          callbacks:{label:function(c){return " 销售额: "+fmt(c.parsed.y,"currency");}},
        }
      },
      scales:{
        x:{grid:{display:false},border:{color:"#DDD8CF"},ticks:{font:{family:SANS,size:11},color:"#8A857C",maxTicksLimit:14,maxRotation:0,autoSkip:true}},
        y:{beginAtZero:true,grid:{color:"#EAE5DB",drawTicks:false},border:{display:false},ticks:{font:{family:SANS,size:11},color:"#8A857C",padding:8,callback:function(v){return fmtCurShort(v);}}}
      }
    }
  });
}

function drawTable(keys,agg,period,total){
  const head='<th>周期</th>'+TABLE_COLS.map(function(c){return "<th>"+c+"</th>";}).join("");
  document.getElementById("thead").innerHTML=head;
  document.getElementById("tbody").innerHTML=keys.map(function(k){
    const o=agg[k];
    return "<tr><td>"+periodLabel(k,period)+"</td>"+TABLE_COLS.map(function(c){
      const v=o[c];
      return "<td"+(v===null||v===undefined?" class='dim'":"")+">"+fmt(v,METRICS[c].kind)+"</td>";
    }).join("")+"</tr>";
  }).join("");
  document.getElementById("tfoot").innerHTML="<td>合计 / 重算</td>"+TABLE_COLS.map(function(c){
    return "<td>"+fmt(total[c],METRICS[c].kind)+"</td>";
  }).join("");
  document.getElementById("tableSub").textContent=keys.length+" 行 · 比率列为区间内重算值";
}

document.getElementById("footMeta").textContent="共 "+DATA.daily.length.toLocaleString("en-US")+" 条日度记录 · "+Object.keys(DATA.products).length+" 个产品（含汇总）";

const fbNote=document.getElementById("fbNote");
if(window.__chartFromInline){
  fbNote.textContent="当前为离线状态，已启用内嵌图表库。";
  fbNote.style.display="block";
}else if(typeof Chart==="undefined"){
  fbNote.textContent="图表库加载失败：CDN 与内嵌副本均不可用，图表无法渲染。";
  fbNote.style.display="block";
}
render();
</script>
</body>
</html>
